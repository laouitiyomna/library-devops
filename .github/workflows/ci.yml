name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle du projet
        run: ./scripts/check-project.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Tests
        working-directory: backend
        run: mvn -B test
      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-java${{ matrix.java }}
          path: backend/target/surefire-reports/*.xml

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans publier)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: library-backend:ci
      - name: Connexion au registre
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier l'image de version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/laouitiyomna/library-backend:${{ github.ref_name }}

  deploy-staging:
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer la configuration de staging
        run: cp .env.staging.example .env.staging
      - name: Mise en service
        run: |
          printf 'IMAGE_TAG=%s\n' "${{ github.ref_name }}" > .env.deploy
          docker compose --env-file .env.deploy -f compose.staging.yaml pull
          docker compose --env-file .env.deploy -f compose.staging.yaml up -d
      - name: Contrôle de santé
        run: ./scripts/wait-healthy.sh
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose --env-file .env.deploy -f compose.staging.yaml logs --tail=50 api
      - name: Nettoyage
        if: always()
        run: docker compose --env-file .env.deploy -f compose.staging.yaml down -v
